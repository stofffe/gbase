[package]
name = "flappy_bird"
version = "0.1.0"
edition = "2021"

[dependencies]
gbase = { path = "../.." }
gbase_utils = { path = "../../utils/gbase_utils" }
bytemuck = { version = "1.14.0", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.88"

[lib]
crate-type = ["rlib", "cdylib"]
