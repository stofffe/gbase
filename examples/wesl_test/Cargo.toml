[package]
name = "wesl_test"
version = "0.1.0"
edition = "2021"

[dependencies]
gbase = { path = "../.." }
gbase_utils = { path = "../../utils/gbase_utils" }
random_wgsl = { path = "../../utils/random_wgsl" }
wesl = "0.4.0"
wgsl-parse = { version = "0.4.0", features = ["imports", "wesl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.88"

[lib]
crate-type = ["rlib", "cdylib"]
